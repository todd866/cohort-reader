name: CohortReader
options:
  bundleIdPrefix: md.cohort
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  CohortReader:
    path: .

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CohortReader-iOS:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: md.cohort.reader
        PRODUCT_NAME: "Cohort Reader"
        INFOPLIST_FILE: App/Resources/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: CohortReader
        product: ReaderKit

  CohortReader-macOS:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: md.cohort.reader.mac
        PRODUCT_NAME: "Cohort Reader"
        INFOPLIST_FILE: App/Resources/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Resources/CohortReaderMac.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: CohortReader
        product: ReaderKit

schemes:
  CohortReader-iOS:
    build:
      targets:
        CohortReader-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  CohortReader-macOS:
    build:
      targets:
        CohortReader-macOS: all
    run:
      config: Debug
    archive:
      config: Release
